[project]
name = "sec100-3gpp-toolkit"
version = "0.1.0"
description = "3GPP network security research toolkit"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.4", "requests>=2.31", "pandas>=2.0", "plotly>=5.0", "streamlit>=1.28", "tqdm>=4.66", "rich>=13.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-mock>=3.12"]

[tool.pytest.ini_options]
testpaths = ["epdg/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E402", "F401", "F811"]
